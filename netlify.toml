# Netlify config for hosting the app. This only builds the static site (Vite).
# Updating the DATA does NOT require a rebuild or redeploy — the app reads the
# database live in the browser from its configured URL (see src/config.js), so
# once this is deployed you rarely touch it again.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node so a future release can't silently change the build.
  NODE_VERSION = "20"

# The private player reviews are read by the auth function (never shipped in the site).
[functions]
  included_files = ["data/reviews/**"]
